name: Build begonia kernel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build begonia (APatch-ready) kernel
    runs-on: ubuntu-latest
    env:
      KERNEL_NAME: Begonia-APatch-Kernel
      TC_ROOT: ${{ github.workspace }}/toolchains
      OUT_DIR: out
      CLANG_VER: clang-r383902
      GCC_VER: android-11.0.0_r1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache zip unzip cpio python3 flex bison \
            libssl-dev bc dwarves zstd libelf-dev

      - name: Setup cache for toolchains
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchains
          key: toolchains-${{ env.CLANG_VER }}-${{ env.GCC_VER }}

      - name: Build kernel
        run: |
          export TC_ROOT="${{ github.workspace }}/toolchains"
          chmod +x build.sh
          ./build.sh

      - name: Verify APatch config flags
        run: |
          # APatch/KernelPatch requires these to resolve kernel symbols.
          # Verify BOTH the pre-build .config AND the config embedded in the
          # final Image, because the built kernel can differ from out/.config.
          grep -E 'CONFIG_KALLSYMS=y' out/.config
          grep -E 'CONFIG_KALLSYMS_ALL=y' out/.config
          grep -E 'CONFIG_KALLSYMS_BASE_RELATIVE=y' out/.config
          python3 - <<'EOF'
          import gzip, re, sys
          img = "out/arch/arm64/boot/Image"
          data = open(img, "rb").read()
          st = data.find(b"IKCFG_ST")
          ed = data.find(b"IKCFG_ED")
          if st < 0 or ed < 0 or ed <= st:
              sys.exit("ERROR: no embedded IKCONFIG found in %s" % img)
          cfg = gzip.decompress(data[st+8:ed]).decode()
          for sym in ("CONFIG_KALLSYMS", "CONFIG_KALLSYMS_ALL", "CONFIG_KALLSYMS_BASE_RELATIVE"):
              if ("%s=y" % sym) not in cfg:
                  sys.exit("ERROR: %s is not y in embedded Image config" % sym)
          print("verified embedded Image config: KALLSYMS_ALL=y KALLSYMS_BASE_RELATIVE=y")
          EOF

      - name: Upload flashable zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-flashable
          path: ${{ env.KERNEL_NAME }}-*.zip
          if-no-files-found: warn

      - name: Upload kernel image (Image.gz-dtb)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error

      - name: Upload plain Image (for kptools-img2kptools / APatch)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image
          path: out/arch/arm64/boot/Image
          if-no-files-found: error
